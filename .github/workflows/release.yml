name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build packs
        run: python tools/build.py --version "${GITHUB_REF_NAME#v}"
      - name: Extract changelog section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG entry for $ver"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x versions and tags like v1.0.0-rc1 are published as pre-releases.
          flags=""
          case "${GITHUB_REF_NAME#v}" in 0.*|*-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Euchre $GITHUB_REF_NAME" --notes-file notes.md $flags
