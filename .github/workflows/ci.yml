name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pinned toolchain. Bump these together when moving to a new Minecraft version.
env:
  MC_VERSION: "26.3"
  JAVA_VERSION: "25"
  # Vanilla server jar (piston-meta); the object id is its sha1.
  VANILLA_SERVER_URL: https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar
  VANILLA_SERVER_SHA1: 33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c
  FABRIC_LOADER: "0.19.5"
  FABRIC_INSTALLER: "1.1.2"
  PACKTEST_URL: https://cdn.modrinth.com/data/XsKUhp45/versions/mZNmN2pR/packtest-2.7.0.jar
  PACKTEST_SHA512: 18d5d0946c8073ccd29e92016b9ff73898762663457d53eb43758fd76f954655b244d539dd9339ed20b61b44106b8963b77c197094b7586559d72461d138bf60
  FABRIC_API_URL: https://cdn.modrinth.com/data/P7dR8mSH/versions/v2j28coa/fabric-api-0.162.0%2B26.3.jar
  FABRIC_API_SHA512: 5ab70908952f1d2346d16b122ca31327f4055db59c279a1bc3c3c581ce359bb541cba15730f55b0727be7c7c4debc4a4412a183c228e0d4dea81c734f7b412ce

jobs:
  lint:
    name: Lint & generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/gen.py --check
      - run: python tools/lint.py
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: dist/*.zip

  packtest:
    name: Test suite (PackTest)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Download Fabric server and mods
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p server/mods server/world/datapacks
          cd server
          curl -fsSL -o fabric-server.jar \
            "https://meta.fabricmc.net/v2/versions/loader/$MC_VERSION/$FABRIC_LOADER/$FABRIC_INSTALLER/server/jar"
          curl -fsSL -o mods/packtest.jar "$PACKTEST_URL"
          curl -fsSL -o mods/fabric-api.jar "$FABRIC_API_URL"
          echo "$PACKTEST_SHA512  mods/packtest.jar" | sha512sum -c -
          echo "$FABRIC_API_SHA512  mods/fabric-api.jar" | sha512sum -c -
          echo "eula=true" > eula.txt
      - name: Install packs
        run: |
          cp -r datapack "$RUNNER_TEMP/server/world/datapacks/euchre"
          cp -r tests/packtest "$RUNNER_TEMP/server/world/datapacks/euchre_test"
      - name: Run tests
        working-directory: ${{ runner.temp }}/server
        # Exit code = number of failed tests; annotations surface failures in the PR.
        run: java -Xmx2G -Dpacktest.auto -Dpacktest.auto.annotations -jar fabric-server.jar nogui

  vanilla-smoke:
    name: Vanilla load smoke test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download vanilla server
        run: |
          curl -fsSL -o "$RUNNER_TEMP/server.jar" "$VANILLA_SERVER_URL"
          echo "$VANILLA_SERVER_SHA1  $RUNNER_TEMP/server.jar" | sha1sum -c -
      - run: python tools/smoke_vanilla.py --server-jar "$RUNNER_TEMP/server.jar" --extra-pack spike
